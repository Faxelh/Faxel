# Projet Xcode de Faxel (SwiftUI + moteur Python intégré).
# Généré sur le Mac de GitHub avec XcodeGen : `xcodegen generate`.
name: Faxel
options:
  bundleIdPrefix: com.faxel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Faxel:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - framework: Support/Python.xcframework
        embed: true
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Faxel"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: "com.faxel.player"
            CFBundleURLSchemes: [faxel]
        LSApplicationQueriesSchemes: [shareddocuments]
        NSFaceIDUsageDescription: "Faxel utilise Face ID pour protéger votre Coffre de fichiers privés."
        NSLocalNetworkUsageDescription: "Faxel reçoit les fichiers envoyés depuis votre ordinateur par Wi-Fi (Transfert Wi-Fi)."
        NSPhotoLibraryAddUsageDescription: "Faxel ajoute les vidéos et photos téléchargées à votre app Photos."
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Audio"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, com.apple.m4a-audio, org.xiph.flac, com.microsoft.waveform-audio]
          - CFBundleTypeName: "Vidéo"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faxel.player
        PRODUCT_NAME: Faxel
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/Faxel-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/Support"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_TESTABILITY: YES
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
    postBuildScripts:
      - name: Install Python
        script: /bin/bash "$PROJECT_DIR/scripts/install_python.sh"
        basedOnDependencyAnalysis: false
