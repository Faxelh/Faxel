# Construit Faxel pour iPhone sur un Mac de GitHub, puis publie la mise à jour.
#
# Résultat : Faxel.ipa dans les artefacts ET dans « Releases » ; Faxel propose
# la nouvelle version toute seule (SideStore / AltStore, ou IPA pour Sideloadly).
# Les erreurs de compilation s'affichent en rouge sur la page de la construction.

name: Faxel – iPhone

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "*.zip"
      - ".github/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# Une nouvelle compilation arrête la précédente (pas de doublons).
concurrency:
  group: faxel-ipa
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version affichée : contenu du fichier VERSION (ex. 2026.1) + nombre de mises à jour
      # depuis sa dernière modification → 2026.1.0, 2026.1.1… Numéro de compilation : minutes
      # écoulées depuis 1970 (il augmente toujours : l'app sait si une version est plus récente).
      - name: Calculer la version
        shell: bash
        run: |
          BASE=$(head -n 1 "$GITHUB_WORKSPACE/VERSION" 2>/dev/null | tr -d '[:space:]')
          BASE=${BASE:-2026.1}
          DEPUIS=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%H -- VERSION)
          if [ -n "$DEPUIS" ]; then N=$(git -C "$GITHUB_WORKSPACE" rev-list --count "$DEPUIS"..HEAD); else N=0; fi
          echo "APP_VERSION=$BASE.$N" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "Version : $BASE.$N"


      - name: Code de Faxel (Swift + moteur)
        shell: bash
        run: |
          set -euo pipefail
          # Le code est dans le dépôt (déballé depuis le zip par « Déballer le zip »).
          if [ -d patch ]; then cp -R patch/. .; fi
          ls ios ios/Sources src/faxel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests du moteur Python
        # Un test qui échoue ne bloque pas la création de l'app : il est
        # signalé en jaune sur la page de la construction.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_engine tests.test_bridge tests.test_fallbacks 2>&1 | tee tests.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):|Error:|error:|No module" tests.log | head -20 | while IFS= read -r line; do
              echo "::warning title=Tests Python::${line:0:900}"
            done
          fi
          exit $STATUS

      - name: Python pour iPhone (Python-Apple-support)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/beeware/Python-Apple-support/releases?per_page=50" \
                --jq '[.[] | select(.tag_name | startswith("3.13-")) | select(.prerelease | not)][0].tag_name')
          echo "Python-Apple-support : $TAG"
          gh release download "$TAG" -R beeware/Python-Apple-support -p "Python-3.13-iOS-support.*.tar.gz" -D support-dl
          mkdir -p support-x ios/Support
          tar -xzf support-dl/*.tar.gz -C support-x
          XCF=$(find support-x -maxdepth 3 -type d -name "Python.xcframework" | head -1)
          test -n "$XCF"
          mv "$XCF" ios/Support/Python.xcframework
          echo "Contenu :"
          find ios/Support/Python.xcframework -maxdepth 3 -type d | head -40
          echo "- Python-Apple-support : $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Moteur de Faxel et paquets (yt-dlp…)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build-python/app/faxel
          cp src/faxel/__init__.py src/faxel/bridge.py ios/build-python/app/faxel/
          cp -R src/faxel/core src/faxel/engine ios/build-python/app/faxel/
          PKGS="yt-dlp==2026.8.19 yt-dlp-ejs==0.8.0 requests urllib3 idna certifi charset-normalizer rubicon-objc"
          python -m pip install --upgrade pip
          python -m pip install --target ios/build-python/app_packages --no-deps --only-binary=:all: \
              --platform any --python-version 3.13 --implementation py $PKGS \
            || python -m pip install --target ios/build-python/app_packages --no-deps $PKGS
          # Aucun module binaire de Mac ne doit partir sur l'iPhone.
          find ios/build-python/app_packages -name "*.so" -print -delete
          rm -rf ios/build-python/app_packages/bin
          find ios/build-python -name "__pycache__" -prune -exec rm -rf {} +
          ls ios/build-python/app_packages

      - name: Projet Xcode
        shell: bash
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compiler pour iPhone et créer Faxel.ipa
        shell: bash
        run: |
          # GitHub lance bash avec -e : on le retire pour pouvoir afficher les erreurs.
          set +e -u -o pipefail
          cd ios
          xcodebuild -project Faxel.xcodeproj -scheme Faxel -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build > ../xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -E "error:" ../xcodebuild.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -40 > ../erreurs.txt
            echo "===== ERREURS DE COMPILATION ====="
            cat ../erreurs.txt
            { echo "## Erreurs de compilation"; echo '```'; cat ../erreurs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Compilation::${line:0:900}"
            done < ../erreurs.txt
            tail -n 80 ../xcodebuild.log
            exit 1
          fi
          grep -E "Python :|Bibliothèque standard|module\(s\) binaire|Python installé" ../xcodebuild.log || true
          APP=build/device/Build/Products/Release-iphoneos/Faxel.app
          test -d "$APP"
          rm -rf Payload ../Faxel.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../Faxel.ipa Payload
          ls -lh ../Faxel.ipa
          echo "- Faxel.ipa : $(du -h ../Faxel.ipa | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier Faxel.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Faxel-iPhone
          path: Faxel.ipa
          retention-days: 30

      # Publie l'IPA dans « Releases » (Faxel signale la nouvelle version) et met à jour
      # la source SideStore / AltStore pour les mises à jour automatiques.
      - name: Publier la mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          NUMERO=$APP_BUILD
          if gh release view "ios-$NUMERO" --repo "$DEPOT" > /dev/null 2>&1; then
            echo "La version ios-$NUMERO est déjà publiée."; exit 0
          fi
          gh release create "ios-$NUMERO" Faxel.ipa \
            --repo "$DEPOT" --title "Faxel iPhone $APP_VERSION" \
            --notes "$(git log -1 --pretty=%s)" --target "${{ github.sha }}"
          TAILLE=$(stat -f%z Faxel.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/$DEPOT/releases/download"
          mkdir -p maj
          cat > maj/source.json <<JSON
          {
            "name": "Faxel",
            "identifier": "com.faxel.player.source",
            "subtitle": "Téléchargeur et lecteur vidéo et musique",
            "apps": [{
              "name": "Faxel",
              "bundleIdentifier": "com.faxel.player",
              "developerName": "Faxel Kwadio",
              "subtitle": "Téléchargeur et lecteur vidéo et musique",
              "localizedDescription": "Téléchargeur et lecteur vidéo et musique",
              "iconURL": "$BASE/ios-source/icone.png",
              "tintColor": "7C5CFF",
              "versions": [{
                "version": "$APP_VERSION",
                "buildVersion": "$NUMERO",
                "date": "$DATE",
                "downloadURL": "$BASE/ios-$NUMERO/Faxel.ipa",
                "size": $TAILLE,
                "minOSVersion": "16.0"
              }]
            }],
            "news": []
          }
          JSON
          cp "ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" maj/icone.png
          gh release delete ios-source --repo "$DEPOT" --yes --cleanup-tag || true
          gh release create ios-source maj/source.json maj/icone.png \
            --repo "$DEPOT" --title "Source SideStore / AltStore" --latest=false \
            --notes "Ajoutez cette adresse dans SideStore ou AltStore : $BASE/ios-source/source.json"
          # On garde seulement les 5 dernières versions iPhone.
          gh release list --repo "$DEPOT" --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^ios-[0-9]+$' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -I{} gh release delete {} --repo "$DEPOT" --yes --cleanup-tag || true
          echo "- Publié : Faxel $APP_VERSION (ios-$NUMERO)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test dans le simulateur (Python, yt-dlp, recherche)
        timeout-minutes: 25
        continue-on-error: true
        shell: bash
        run: |
          # GitHub lance bash avec -e : on le retire pour pouvoir afficher les erreurs.
          set +e -u -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), key=lambda k: [int(p) for p in k.rsplit('iOS-', 1)[-1].split('-') if p.isdigit()])
          for runtime in reversed(runtimes):
              phones = [d['udid'] for d in devices[runtime] if d['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]); break
          ")
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          cd ios
          xcodebuild -project Faxel.xcodeproj -scheme Faxel -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > ../sim-build.log 2>&1
          if [ $? -ne 0 ]; then
            grep -E "error:" ../sim-build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -30 | while IFS= read -r line; do
              echo "::error title=Simulateur (compilation)::${line:0:900}"
            done
            tail -n 60 ../sim-build.log
            exit 1
          fi
          APP=$(find build/sim/Build/Products -maxdepth 2 -name "Faxel.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_FAXEL_SELFTEST=1 perl -e 'alarm shift; exec @ARGV' 300 \
            xcrun simctl launch --console-pty "$UDID" com.faxel.player > ../selftest.log 2>&1 || true
          tail -n 60 ../selftest.log
          RESULT=$(grep -a "FAXEL-SELFTEST-RESULT" ../selftest.log | tail -1 || true)
          {
            echo "## Test dans le simulateur"
            echo '```'
            if [ -n "$RESULT" ]; then echo "$RESULT"; else echo "Aucun résultat : app non lancée ou arrêtée."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULT" | grep -q '"ok":true'; then
            echo "::notice title=Simulateur::Python, yt-dlp et la recherche fonctionnent."
          else
            echo "::error title=Simulateur::Test raté : $RESULT"
            grep -a -E "Traceback|Error|error" ../selftest.log | tail -n 20 | while IFS= read -r line; do
              echo "::warning title=Journal::${line:0:900}"
            done
            exit 1
          fi
